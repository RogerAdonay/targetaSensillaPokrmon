<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: orangered;
            text-align: center;
        }
        article{
            width: 40%;
            display: inline-block;
            background: white;
        }
        img{
            width: 80%;
        }
        h1{
            border-radius: 20px;
            background: orangered;
            color: white;
            display: inline-block;
            width: 80%;
            font-size: 20px;
            padding: 5px;
        }
        .tableInfo{
            border:solid gray;
            width: 80%;
            display: inline-block;
            margin-bottom:30px;
        }
        table{
            width: 100%;
        }
        caption{
            font-size: 18px;
        }
        td{
            display: inline-block;
            width: 45%;
        }
        td:last-child{
            color: red;
        }
    </style>
</head>
<body>
    <article>
        <header>
            <img 
            src="https://img.pokemondb.net/artwork/vector/large/vulpix.png" 
            alt="">
            <h1>VULPIX</h1>
        </header>
        <div class="tableInfo">
            <table>
                <caption> ～ Caracteristicas ～ </caption>
                <tr>
                    <td>HP</td>
                    <td>30</td>
                </tr>
                <tr>
                    <td>ATTACK</td>
                    <td>41</td>
                </tr>
                <tr>
                    <td>DEFENSE</td>
                    <td>40</td>
                </tr>
                <tr>
                    <td>SPECIAL ATTACK</td>
                    <td>50</td>
                </tr>
                <tr>
                    <td>SPECIAL DEFENSE</td>
                    <td>65</td>
                </tr>
                <tr>
                    <td>SPEED</td>
                    <td>65</td>
                </tr>
            </table>
        </div>
    </article>
</body>
</html>
